[project]
name = "pricescope"
version = "0.1.0"
description = "Find competitor product URLs on marketplaces using LLM-powered search"
requires-python = ">=3.12"
readme = "README.md"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
