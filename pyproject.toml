[project]
name = "pricescope"
version = "0.1.0"
description = "Find competitor product URLs on marketplaces using LLM-powered search"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "aiohttp>=3.14",
    "beautifulsoup4>=4.15",
    "ddgs>=9.14",
    "httpx>=0.28",
    "image-load-compression",
    "langchain-openai>=1.4",
    "langgraph>=1.2",
    "lxml>=6.1",
    "openpyxl>=3.1",
    "pandas>=3.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "python-dotenv>=1.2",
    "PyYAML>=6.0",
    "quantulum3>=0.10",
    "rapidfuzz>=3.14",
    "tqdm>=4.69",
]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.3"]
notebook = ["ipykernel>=7.3", "ipython>=9.16", "requests>=2.34"]

[tool.uv]
package = false
python-preference = "only-managed"

[tool.uv.sources]
image-load-compression = { path = "../image-load-compression", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
markers = [
    "live: calls real BrightData or LLM APIs and may incur charges; skipped by default, run with -m live",
    "slow: starts real sandbox subprocesses or performs multi-second I/O",
]
