# ============================================================
# Pipeline configuration for the product-URL matching system.
# Edit for tuning — not per-run. Per-run settings are function
# arguments (or flags to python -m src.search.batch).
# ============================================================

search:
  # Search engine strategy.
  # A single name = use only that provider for every row (no escalation):
  #     provider: serper          # Google via Serper API; needs SERPER_KEY
  #     provider: duckduckgo      # free; no API key; ~1s rate limit between calls
  # A list = ordered chain; if the prior yields NO_MATCH for a row,
  # escalate to the next provider for that row:
  #     provider: [duckduckgo, serper]   # cheap-first, paid fallback
  #     provider: [serper, duckduckgo]   # paid-first
  # Adding a third engine later (e.g. tavily) just extends the list:
  #     provider: [duckduckgo, serper, tavily]
  provider: [duckduckgo, serper]
  # Max number of results to request per search query
  k: 10
  # Query rewriting strategies applied to each product name:
  #   raw            – use the product name as-is
  #   with_retailer_kw – append the retailer keyword (e.g. "Tesco")
  #   strip_parens   – remove parenthesised text from the name
  query_variants: [raw, with_retailer_kw, strip_parens]
  # Keyword appended to queries when using the "with_retailer_kw" variant.
  # Keyed by the website argument passed to the public APIs.
  retailer_keywords:
    tesco: Tesco
    argos: Argos
    amazon: Amazon

# Maps website codes to expected host domains.
# The domain_filter layer kills candidates whose URL host doesn't match.
# A value ending in "." is a registrable-name prefix: it matches that name
# under any TLD (amazon. → amazon.de / amazon.fr / amazon.co.uk).
# A value without the trailing dot matches that exact host and its subdomains.
domain_map:
  tesco:  tesco.com
  argos:  argos.co.uk
  amazon.co.uk: amazon.co.uk
  amazon.nl: amazon.nl

brand:
  # RapidFuzz score >= this → brands considered the same (pass)
  fuzzy_same_threshold: 88
  # RapidFuzz score <= this → brands considered different (fail)
  # Scores between the two thresholds → unknown
  fuzzy_differ_threshold: 40

numeric:
  # Allowed relative difference for continuous attributes (e.g. weight, volume).
  # 0.10 = ±10%. Values outside this range → fail.
  continuous_tolerance: 0.10
  # Maps quantulum3 entity names to canonical attribute names used internally.
  entity_to_attr:
    volume: volume_ml
    mass: weight_g
    "data storage": storage_gb
    length: length_mm
    power: power_w
    "electric potential": voltage_v
    charge: charge_mah
  # Conversion factors to normalise parsed values into the canonical unit.
  # Each sub-key is a recognised unit string; value is the multiplier
  # to convert to the canonical unit (e.g. "kg: 1000" → 1 kg = 1000 g).
  unit_conversions:
    volume_ml:
      l: 1000
      litre: 1000
      litres: 1000
      ml: 1
      millilitre: 1
      millilitres: 1
      cl: 10
      centilitre: 10
      "fluid ounce": 29.5735
      "fl oz": 29.5735
    weight_g:
      kg: 1000
      kilogram: 1000
      kilograms: 1000
      g: 1
      gram: 1
      grams: 1
      mg: 0.001
      milligram: 0.001
      milligrams: 0.001
      ounce: 28.3495
      oz: 28.3495
      pound: 453.592
      "pound-mass": 453.592
      lb: 453.592
    storage_gb:
      gb: 1
      gigabyte: 1
      gigabytes: 1
      tb: 1000
      terabyte: 1000
      terabytes: 1000
      mb: 0.001
      megabyte: 0.001
      megabytes: 0.001
    ram_gb:
      gb: 1
      gigabyte: 1
      gigabytes: 1
      tb: 1000
      terabyte: 1000
      terabytes: 1000
      mb: 0.001
      megabyte: 0.001
      megabytes: 0.001
    length_mm:
      mm: 1
      millimetre: 1
      millimetres: 1
      cm: 10
      centimetre: 10
      centimetres: 10
      m: 1000
      metre: 1000
      metres: 1000
    screen_inch:
      inch: 1
    power_w:
      watt: 1
      kilowatt: 1000
    voltage_v:
      volt: 1
      millivolt: 0.001
    charge_mah:
      "milliampere-hour": 1
      "ampere-hour": 1000
  # Attributes compared with exact equality (not ±tolerance).
  discrete_attrs: [storage_gb, ram_gb, count, screen_inch, voltage_v, abv_percent, power_w]
  # When a numeric entity is ambiguous (e.g. "256GB" could be RAM or storage),
  # look this many chars around the number for a disambiguating keyword.
  ambiguity_window_chars: 20
  # Disambiguation rules: if a keyword is found near an ambiguous entity,
  # assign the value to the specified attribute instead of the default.
  ambiguity_rules:
    "data storage":
      ram: ram_gb
      memory: ram_gb
      "memory card": storage_gb
      storage: storage_gb
      rom: storage_gb
      ssd: storage_gb
      hdd: storage_gb
      card: storage_gb
      sd: storage_gb
      microsd: storage_gb
      "flash drive": storage_gb

llm:
  # Model identifier — routed to a base_url/API key via maintain/llm_router_config.yaml.
  # Change this line alone to switch vendor/model.
  model: deepseek-v4-flash
  # Sampling temperature — lower = more deterministic
  temperature: 0.1
  # HTTP timeout in seconds for LLM calls
  timeout_s: 60

cache:
  # Path to the SQLite file caching base extraction results (brand + numeric).
  # Keyed on md5(extractor version + title) — same title is never re-extracted
  # until the extractor version changes.
  sqlite_path: .cache/base_extraction.sqlite

db:
  # Persistent run/task trace database. Relative paths resolve from the process cwd.
  sqlite_path: search_db.sqlite
  enabled: true
  # Disable either payload class for high-volume batches while retaining summaries.
  store_candidates: true
  store_llm_payload: true
